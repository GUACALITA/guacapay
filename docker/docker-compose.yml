# guacapay local stack.
# Run from the repository root: docker compose -f docker/docker-compose.yml up --build
name: guacapay

services:
  app:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      # Fixed container values. They take precedence over .env so the mappings below stay valid.
      APP_PORT: "3202"
      DATABASE_PATH: /app/data/guacapay.db
      # The platform's Open Payments key is read from the secrets folder mounted below, never from the host path in .env.
      OPEN_PAYMENTS_PRIVATE_KEY_PATH: /app/keys/ilp-testnet-private.key
      # Development: email goes to the local mail catcher, never to a real inbox.
      SMTP_HOST: mailcatcher
      SMTP_PORT: "1025"
    ports:
      - "${APP_PORT:-3202}:3202"
    volumes:
      - app_data:/app/data
      # The folder that holds the platform's Open Payments key, read-only. Set OPEN_PAYMENTS_SECRETS_DIR in .env; it defaults to ../keys.
      - ${OPEN_PAYMENTS_SECRETS_DIR:-../keys}:/app/keys:ro
    depends_on:
      mailcatcher:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3202/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # The Rapyd gateway is not part of this stack (decision 017). Its code stays in gateway/ for development only.

  mailcatcher:
    image: axllent/mailpit:latest
    # SMTP (1025) stays inside the Docker network; only the web UI is published.
    ports:
      - "8026:8025"
    restart: unless-stopped

volumes:
  app_data:
