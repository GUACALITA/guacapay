# guacapay local stack.
# Run from the repository root: docker compose -f docker/docker-compose.yml up --build
name: guacapay

services:
  app:
    build:
      context: ..
      dockerfile: docker/app.Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      # Fixed container values. They take precedence over .env so the mappings below stay valid.
      APP_PORT: "3202"
      DATABASE_PATH: /app/data/guacapay.db
      # Inside the Docker network the gateway is reached by service name.
      GATEWAY_URL: http://gateway:3203
    ports:
      - "${APP_PORT:-3202}:3202"
    volumes:
      - app_data:/app/data
      - ../keys:/app/keys:ro
    depends_on:
      gateway:
        condition: service_healthy
      mailcatcher:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3202/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: docker/gateway.Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      # Fixed container port. Takes precedence over .env so the host mapping below stays valid.
      GATEWAY_PORT: "3203"
      # Inside the Docker network the app is reached by service name.
      APP_URL: http://app:3202
    # Bound to localhost only. The gateway also requires GATEWAY_TOKEN on checkout routes.
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3203}:3203"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3203/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mailcatcher:
    image: axllent/mailpit:latest
    # SMTP (1025) stays inside the Docker network; only the web UI is published.
    ports:
      - "8026:8025"
    restart: unless-stopped

volumes:
  app_data:
