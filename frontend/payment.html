<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment status · guacapay</title>
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="js/shell.js"></script>
  <script type="module" src="js/pages/payment.js"></script>
  <script type="module" src="js/balance-panel.js"></script>
</head>
<body>
  <div class="banner" id="sandbox-banner" role="status" hidden>Sandbox mode. No real money moves.</div>

  <header class="site-header">
    <a class="brand" href="index.html">guacapay</a>
    <nav class="site-nav" aria-label="Main">
      <a href="new.html">Send money</a>
    </nav>
  </header>

  <main class="page">
    <h1>Payment status</h1>

    <section class="card" id="signed-out" hidden>
      <p>Sign in to see this payment.</p>
      <p><a href="index.html">Go to sign in</a></p>
    </section>

    <section class="card" id="status-section" aria-labelledby="status-title" hidden>
      <h2 id="status-title">Status</h2>
      <p id="status-text" class="status" role="status" aria-live="polite"></p>
      <p id="payment-summary" class="muted"></p>
    </section>

    <section class="card" id="pay-section" aria-labelledby="pay-title" hidden>
      <h2 id="pay-title">How do you want to pay?</h2>
      <button type="button" id="pay-balance">Pay with app balance</button>
      <button type="button" id="pay-testnet" class="secondary">Pay with testnet balance</button>
      <button type="button" id="pay-rapyd" class="secondary">Pay with card (Rapyd)</button>
      <p id="pay-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card" id="balance-card" aria-labelledby="balance-title">
      <h2 id="balance-title">Your app balance</h2>
      <p id="balance-amount" class="status">Loading…</p>
      <form id="recharge-form" novalidate>
        <label for="recharge-amount">Amount to add (USD)</label>
        <input id="recharge-amount" name="amount" type="text" inputmode="decimal" autocomplete="off">
        <p class="field-error" id="recharge-error" hidden></p>
        <button type="submit" id="recharge-submit">Recharge with Rapyd</button>
      </form>
      <p id="recharge-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <p id="page-error" class="field-error" role="alert" hidden></p>
  </main>

  <footer class="site-footer">
    <p class="muted">guacapay</p>
  </footer>
</body>
</html>
