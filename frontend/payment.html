<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment · guacapay</title>
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="js/shell.js"></script>
  <script type="module" src="js/pages/payment.js"></script>
</head>
<body>
  <div class="banner" id="sandbox-banner" role="status" hidden>Sandbox mode. No real money moves.</div>

  <header class="site-header">
    <a class="brand" href="index.html">guacapay</a>
    <nav class="site-nav" aria-label="Main">
      <a href="new.html">Send money</a>
    </nav>
  </header>

  <main class="page">

    <section class="card" id="signed-out" hidden>
      <p>Sign in to see this payment.</p>
      <p><a href="index.html">Go to sign in</a></p>
    </section>

    <section class="card payment-hero" id="status-section" hidden>
      <div class="payment-amount" id="payment-amount"></div>
      <p class="payment-to muted" id="payment-to"></p>
      <span class="status-badge" id="status-badge" role="status" aria-live="polite"></span>
    </section>

    <section class="card qr-block" id="qr-section" hidden>
      <img id="qr-img" src="" alt="QR code for this payment" width="200" height="200">
      <p class="muted">Scan to open this payment</p>
    </section>

    <section class="card" id="pay-section" aria-labelledby="pay-title" hidden>
      <h2 id="pay-title">Pay from my wallet</h2>
      <p class="muted" id="pay-empty" hidden></p>
      <form id="pay-form" novalidate>
        <label for="pay-wallet">Wallet to pay from</label>
        <select id="pay-wallet" name="wallet"></select>
        <button type="submit" id="pay-wallet-submit">Pay now</button>
      </form>
      <p id="pay-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="card dev-card" id="dev-section" hidden>
      <h2 class="dev-title">⚡ Demo mode</h2>
      <p class="muted">Testnet wallet sin fondos? Fuerza el pago para la demo.</p>
      <button type="button" id="dev-force-btn" class="dev-btn">Forzar pago (demo)</button>
      <p id="dev-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <p id="page-error" class="field-error" role="alert" hidden></p>

  </main>

  <footer class="site-footer">
    <p class="muted">guacapay</p>
  </footer>
</body>
</html>
