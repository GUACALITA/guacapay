<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send money · guacapay</title>
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="js/shell.js"></script>
  <script type="module" src="js/pages/new-payment.js"></script>
  <script type="module" src="js/balance-panel.js"></script>
</head>
<body>
  <div class="banner" id="sandbox-banner" role="status" hidden>Sandbox mode. No real money moves.</div>

  <header class="site-header">
    <a class="brand" href="index.html">guacapay</a>
    <nav class="site-nav" aria-label="Main">
      <a href="new.html" aria-current="page">Send money</a>
    </nav>
  </header>

  <main class="page">
    <h1>Send money</h1>

    <section class="card" id="signed-out" hidden>
      <p>You need to sign in before you can send money.</p>
      <p><a href="index.html">Go to sign in</a></p>
    </section>

    <section class="card" id="form-section" aria-labelledby="form-title" hidden>
      <h2 id="form-title">Payment details</h2>

      <form id="payment-form" novalidate>
        <label for="recipient-email">Recipient email</label>
        <input id="recipient-email" name="recipient_email" type="email" autocomplete="off" required>
        <p class="field-error" id="recipient-email-error" hidden></p>

        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="text" inputmode="decimal" autocomplete="off" required>
        <p class="field-error" id="amount-error" hidden></p>

        <label for="currency">Currency</label>
        <select id="currency" name="currency"></select>
        <p class="field-error" id="currency-error" hidden></p>

        <label for="message">Message (optional)</label>
        <textarea id="message" name="message" rows="3" maxlength="500"></textarea>
        <p class="field-error" id="message-error" hidden></p>

        <button type="submit" id="submit-payment">Continue to payment</button>
      </form>

      <p id="form-status" class="status" role="status" aria-live="polite"></p>
    </section>
    <section class="card" id="balance-card" aria-labelledby="balance-title" hidden>
      <h2 id="balance-title">Your app balance</h2>
      <p id="balance-amount" class="status">Loading…</p>
      <form id="recharge-form" novalidate>
        <label for="recharge-amount">Amount to add (USD)</label>
        <input id="recharge-amount" name="amount" type="text" inputmode="decimal" autocomplete="off">
        <p class="field-error" id="recharge-error" hidden></p>
        <button type="submit" id="recharge-submit">Recharge with Rapyd</button>
      </form>
      <p id="recharge-status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="site-footer">
    <p class="muted">guacapay</p>
  </footer>
</body>
</html>
